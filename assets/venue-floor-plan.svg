<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 542" width="660" height="542" role="img" aria-labelledby="floor-title floor-desc">
  <title id="floor-title">Herman Hu Concourse, Yeung Kin Man Academic Building, 4/F</title>
  <desc id="floor-desc">LT1 is opposite LT2. The doors to LT1, LT3 and LT4 face Herman Hu Concourse. In the Yellow Zone, Y4702 is beside LT4 and Y4302 is beside LT3. In the Blue Zone, B4702 is beside LT8 and B4302 is beside LT7. The shaded conference area lies between LT5 and LT6 and contains the Poster Session and Coffee Break space above the Registration Desk. Dashed arrows lead from the concourse to the entrances on the lower edges of the four classrooms.</desc>
  <style>
    .zone { font: 11px 'JetBrains Mono', Menlo, monospace; letter-spacing: .45px; fill: #4b5569; }
    .room { fill: #fafbfd; stroke: #c7cfde; stroke-width: 1.2; }
    .conference-room { fill: #eaf0fa; stroke: #3c4990; stroke-width: 1.5; }
    .room-label, .conference-label, .classroom-label, .concourse-name, .registration-label, .activity-label { font-family: Inter, Arial, sans-serif; text-anchor: middle; }
    .room-label { font-size: 18px; fill: #626d85; font-weight: 600; }
    .conference-label { font-size: 22px; fill: #2f3a78; font-weight: 700; }
    .classroom-label { font-size: 19px; fill: #2f3a78; font-weight: 700; }
    .concourse-name { font-size: 12px; fill: #53617b; font-weight: 600; }
    .registration-label { font-size: 13px; fill: #2f3a78; font-weight: 600; }
    .activity-label { font-size: 15px; fill: #2f3a78; font-weight: 700; }
    .direction { font: 11px Inter, Arial, sans-serif; letter-spacing: .2px; fill: #53617b; text-anchor: middle; }
    .entrance { fill: #ffffff; stroke: #33477c; stroke-width: 1.5; }
    .access-route { fill: none; stroke: #4e62a4; stroke-width: 1.7; stroke-dasharray: 4 3; }
    .access-arrow { fill: #4e62a4; }
  </style>

  <rect x=".6" y=".6" width="658.8" height="540.8" rx="6" fill="#ffffff" stroke="#d8dce8" stroke-width="1.2"/>

  <!-- Zone markers and corridor. -->
  <path d="M32 132h194M434 132h194M32 354h194M434 354h194" fill="none" stroke="#dfe4ef"/>
  <rect x="32" y="33" width="4" height="14" rx="1" fill="#d79a62"/>
  <rect x="32" y="140" width="4" height="14" rx="1" fill="#c6a244"/>
  <rect x="32" y="362" width="4" height="14" rx="1" fill="#7891be"/>
  <text class="zone" x="44" y="44">ORANGE ZONE</text>
  <text class="zone" x="44" y="151">YELLOW ZONE</text>
  <text class="zone" x="44" y="373">BLUE ZONE</text>

  <path d="M248 31h164v86H248zM248 335h164v48h216v76H412v44H248v-44H32v-76h216z" fill="#fcfdff"/>
  <path id="conference-area" d="M259 247H401V369H259z" fill="#edf2fa"/>
  <path d="M248 31h164v136h216v78H412v138h216v76H412v44H248v-44H32v-76h216V245H32v-78h216z" fill="none" stroke="#c5cfdf" stroke-width="1.2"/>
  <path d="M248 126v135M412 126v135M248 345v128M412 345v128" fill="none" stroke="#e1e7f1"/>
  <text class="concourse-name" x="330" y="84">Herman Hu Concourse</text>
  <rect x="267" y="254" width="126" height="62" rx="4" fill="#e8eef8" stroke="#9caccd" stroke-width="1.1"/>
  <text class="activity-label" x="330" y="280">Poster Session</text>
  <text class="activity-label" x="330" y="300">Coffee Break</text>
  <rect x="269" y="324" width="122" height="36" rx="4" fill="#ffffff" stroke="#9caccd" stroke-width="1.1"/>
  <text class="registration-label" x="330" y="347">Registration Desk</text>

